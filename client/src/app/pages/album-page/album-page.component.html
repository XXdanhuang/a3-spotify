
@if (album) {
  <div class="row">

    <!-- Album information -->
    <div class="col-12 col-sm-6">
      <h1>{{ album.name }}</h1>

      <img
        id="albumImg"
        [src]="album.imageURL"
        [alt]="album.name">

      <!-- Album popularity -->
      <h3>Popularity</h3>
      <app-thermometer
        [popularity]="album.popularity">
      </app-thermometer>

      <!-- Album artists -->
      @for (artist of album.artists; track artist.id) {
        <p>
          Artist:
          <a [routerLink]="['/artist', artist.id]">
            {{ artist.name }}
          </a>
        </p>
      }

      <!-- Spotify album link -->
      <p>
        <a
          class="btn btn-light"
          [href]="album.url"
          target="_blank"
          rel="noopener noreferrer">
          Open {{ album.name }} on Spotify
        </a>
      </p>
    </div>

    <!-- Album tracks -->
    <div class="col-12 col-sm-6">
      <h3>Album Tracks</h3>

      <app-track-list
        [tracks]="tracks"
        [hideArtist]="true"
        [hideAlbum]="true">
      </app-track-list>
    </div>

  </div>
}

@if (errorMessage) {
  <p role="alert">
    {{ errorMessage }}
  </p>
}
