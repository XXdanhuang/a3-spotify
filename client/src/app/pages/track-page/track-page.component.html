
<div class="row">
  @if (track) {

    <!-- Track information -->
    <div class="col-sm-6 col-12">
      <h1>{{ track.name }}</h1>

      <!-- Album link -->
      <p>
        Track on
        <a [routerLink]="['/album', track.album.id]">
          {{ track.album.name }}
        </a>
      </p>

      <!-- Artists -->
      <div>
        @for (artist of track.artists; track artist.id) {
          <p>
            Artist:
            <a [routerLink]="['/artist', artist.id]">
              {{ artist.name }}
            </a>
          </p>
        }
      </div>

      <!-- Duration -->
      <p>
        Duration: {{ track.durationStr }}
      </p>

      <!-- Spotify track link -->
      <p>
        <a
          class="btn btn-light"
          role="button"
          [href]="track.url"
          target="_blank"
          rel="noopener noreferrer">
          Open {{ track.name }} on Spotify
        </a>
      </p>
    </div>

    <!-- Popularity -->
    <div class="col-sm-6 col-12">
      <h3>Popularity</h3>

      <app-thermometer
        [popularity]="track.popularity">
      </app-thermometer>
    </div>

  }
</div>

@if (errorMessage) {
  <p role="alert">
    {{ errorMessage }}
  </p>
}
