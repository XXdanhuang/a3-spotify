<button class="btn btn-light" (click)="loadAboutMe()">
  Load info about me
</button>

<p *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

<h3>Logged in user: {{ name }}</h3>

<img [src]="profile_pic" class="profile" alt="User profile picture">

<p>
  <a
    *ngIf="profile_link"
    class="btn btn-light"
    [href]="profile_link"
    target="_blank"
    rel="noopener noreferrer">
    Open profile on Spotify
  </a>
</p>
