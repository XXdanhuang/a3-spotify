
<!-- Load user information -->
<button class="btn btn-light" (click)="loadInfo()">
  Load info about me
</button>

<!-- Display username -->
<h3>Logged in user: {{name}}</h3>

<!-- Display profile picture -->
<img [src]="profile_pic" class="profile">

<p>
  <!-- Open Spotify profile -->
  <a class="btn btn-light"
     [href]="profile_link"
     target="_blank">
    Open profile on Spotify
  </a>
</p>
