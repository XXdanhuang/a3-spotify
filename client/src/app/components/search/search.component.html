<h1>Search Spotify</h1>

<input
  [(ngModel)]="searchString"
  (keyup.enter)="search()"
  aria-label="Search keywords"
  placeholder="Enter a name">

<select [(ngModel)]="searchCategory" aria-label="Search category">
  <option *ngFor="let category of searchCategories" [value]="category">
    {{ category }}
  </option>
</select>

<button
  class="btn btn-light"
  (click)="search()"
  [disabled]="loading || !searchString.trim()">
  {{ loading ? 'Searching...' : 'Search' }}
</button>

<p *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

<app-carousel
  *ngIf="resources.length > 0 &&
    (resultCategory === 'artist' || resultCategory === 'album')"
  [resources]="resources"
  carouselId="search-results">
</app-carousel>

<app-track-list
  *ngIf="tracks.length > 0 && resultCategory === 'track'"
  [tracks]="tracks">
</app-track-list>
