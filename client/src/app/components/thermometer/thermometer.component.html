
<div class="progress">
  @if (popularity) {
    <div
      class="progress-bar"
      role="progressbar"
      [style.width]="popularity.percentageString"
      [style.background-color]="popularity.color"
      [attr.aria-valuenow]="popularity.percent * 100"
      aria-valuemin="0"
      aria-valuemax="100">

      <span class="progress-bar-text">
        {{ popularity.percentageString }}
      </span>
    </div>
  }
</div>
